<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSP VORTEX - UID TRACKER</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: linear-gradient(135deg, #050816, #101b3b);
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      background: #111c36;
      border: 1px solid #168cff;
      border-radius: 18px;
      box-shadow: 0 0 22px #087bff55;
    }

    h1 {
      text-align: center;
      color: #24aaff;
      font-size: 29px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #b9c8e8;
      margin-bottom: 25px;
    }

    input, select, button {
      width: 100%;
      padding: 14px;
      margin: 9px 0;
      border-radius: 9px;
      font-size: 16px;
    }

    input, select {
      background: #071329;
      color: white;
      border: 1px solid #287bd1;
      outline: none;
    }

    button {
      background: linear-gradient(90deg, #087bff, #00c6ff);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      text-align: center;
      color: #ffd166;
      min-height: 24px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .result {
      margin-top: 20px;
    }

    .result h2 {
      color: #24aaff;
      text-align: center;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 13px;
      margin: 9px 0;
      background: #071329;
      border: 1px solid #263e68;
      border-radius: 8px;
    }

    .item span:first-child {
      color: #a9c8ed;
    }

    .item span:last-child {
      text-align: right;
      overflow-wrap: anywhere;
    }

    footer {
      text-align: center;
      color: #8194b8;
      margin-top: 25px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>GSP VORTEX</h1>
    <div class="subtitle">FREE FIRE UID TRACKER</div>

    <input
      type="text"
      id="uid"
      placeholder="Enter Free Fire UID"
      inputmode="numeric"
    >

    <select id="region">
      <option value="IND">India (IND)</option>
      <option value="BD">Bangladesh (BD)</option>
      <option value="SG">Singapore (SG)</option>
      <option value="BR">Brazil (BR)</option>
      <option value="US">USA (US)</option>
      <option value="PK">Pakistan (PK)</option>
      <option value="ME">Middle East (ME)</option>
      <option value="EU">Europe (EU)</option>
    </select>

    <button id="checkButton" onclick="checkUID()">
      CHECK UID
    </button>

    <div id="message">Enter UID to check account information.</div>

    <div class="result">
      <h2>PLAYER INFORMATION</h2>

      <div class="item">
        <span>Player Name</span>
        <span id="name">---</span>
      </div>

      <div class="item">
        <span>Player Level</span>
        <span id="level">---</span>
      </div>

      <div class="item">
        <span>Creation Date</span>
        <span id="created">---</span>
      </div>

      <div class="item">
        <span>Total Account Days</span>
        <span id="days">---</span>
      </div>

      <div class="item">
        <span>Last Login</span>
        <span id="login">---</span>
      </div>
    </div>

    <footer>
      © 2026 GSP VORTEX | UID TRACKER
    </footer>

  </div>

  <script>
    async function checkUID() {
      const uid = document.getElementById("uid").value.trim();
      const region = document.getElementById("region").value;
      const message = document.getElementById("message");
      const button = document.getElementById("checkButton");

      const fields = ["name", "level", "created", "days", "login"];

      if (!uid) {
        message.innerText = "Please enter a UID first!";
        return;
      }

      if (!/^[0-9]+$/.test(uid)) {
        message.innerText = "Please enter a valid numeric UID.";
        return;
      }

      button.disabled = true;
      button.innerText = "CHECKING...";
      message.innerText = "Connecting to GSP VORTEX Server...";

      fields.forEach(id => {
        document.getElementById(id).innerText = "Loading...";
      });

      try {
        const url =
          "https://gsp-ff-uid-tracker.onrender.com/api/player?uid=" +
          encodeURIComponent(uid) +
          "&region=" + encodeURIComponent(region);

        const response = await fetch(url);
        const data = await response.json();

        if (!response.ok || data.success === false) {
          throw new Error(data.message || "Player data is not available.");
        }

        document.getElementById("name").innerText =
          data.name ?? data.playerName ?? "Not available";

        document.getElementById("level").innerText =
          data.level ?? "Not available";

        document.getElementById("created").innerText =
          data.created ?? data.creationDate ?? "Not available";

        document.getElementById("days").innerText =
          data.days ?? data.totalDays ?? "Not available";

        document.getElementById("login").innerText =
          data.login ?? data.lastLogin ?? "Not available";

        message.innerText = "Player information loaded!";

      } catch (error) {
        message.innerText = error.message ||
          "Server connection failed. Please try again.";

        fields.forEach(id => {
          document.getElementById(id).innerText = "Unavailable";
        });

      } finally {
        button.disabled = false;
        button.innerText = "CHECK UID";
      }
    }
  </script>

</body>
</html>
